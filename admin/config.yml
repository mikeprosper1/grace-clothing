backend:
  name: github
  repo: mikeprosper1/grace-clothing   # your GitHub repo
  branch: main                         # branch you want CMS to update
  auth_type: implicit                  # GitHub OAuth login
  site_domain: https://grace-clothing.netlify.app # your Netlify site

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "products"
        label: "Products List"
        file: "data/products.json"
        format: "json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "number" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Price", name: "price", widget: "number" }
              - { label: "Stock", name: "stock", widget: "number" }
              - { label: "Image", name: "image", widget: "image" }