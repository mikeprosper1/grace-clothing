backend:
  name: github
  repo: mikeprosper1/grace-clothing
  branch: main
  base_url: https://grace-clothings.netlify.app/admin
  auth_endpoint: /.netlify/functions/auth-callback

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    files:
      - name: "products"
        label: "Products List"
        file: "data/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            fields:
              - {label: "ID", name: "id", widget: "number"}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Price", name: "price", widget: "number"}
              - {label: "Stock", name: "stock", widget: "number"}
              - {label: "Image", name: "image", widget: "image"}