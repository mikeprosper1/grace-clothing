<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grace Clothing - Admin Panel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    :root {
      --black: #0f0f0f;
      --gold: #d4af37;
      --white: #ffffff;
      --gray: #f5f5f5;
    }

    body {
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .admin-header {
      background: var(--black);
      color: var(--gold);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
    }

    .admin-header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .admin-header p {
      color: #ddd;
      font-size: 14px;
    }

    .admin-controls {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--black);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }

    .product-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s;
      border: 2px solid transparent;
    }

    .product-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold);
    }

    .product-image-container {
      position: relative;
      margin-bottom: 15px;
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      background: #000;
    }

    .change-image-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: var(--gold);
      color: var(--black);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .product-card:hover .change-image-btn {
      opacity: 1;
    }

    .product-field {
      margin-bottom: 12px;
    }

    .product-field label {
      display: block;
      color: var(--gold);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .product-field input {
      width: 100%;
      background: #0f0f0f;
      color: var(--white);
      border: 2px solid #333;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    .product-field input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .product-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .btn-save {
      flex: 1;
      background: var(--gold);
      color: var(--black);
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-save:hover {
      opacity: 0.9;
    }

    .btn-delete {
      background: #c41e3a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-delete:hover {
      background: #a01729;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      overflow-y: auto;
    }

    .modal-content {
      background: #1a1a1a;
      margin: 50px auto;
      padding: 30px;
      max-width: 500px;
      border-radius: 12px;
      border: 2px solid var(--gold);
    }

    .modal-header {
      color: var(--gold);
      font-size: 24px;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: var(--gold);
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      background: #0f0f0f;
      border: 2px solid #333;
      color: white;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--gold);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .btn-cancel {
      flex: 1;
      background: #555;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .loading {
      text-align: center;
      color: var(--gold);
      font-size: 18px;
      padding: 40px;
    }

    .success-message {
      background: #2ecc71;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
      animation: slideDown 0.3s;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .image-preview {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 10px;
      display: none;
    }

    @media screen and (max-width: 768px) {
      .products-grid {
        grid-template-columns: 1fr;
      }

      .admin-header h1 {
        font-size: 22px;
      }

      .modal-content {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="admin-header">
    <h1>👗 Grace Clothing Admin Panel</h1>
    <p>Manage your products easily - Add, Edit, Delete & Upload Images</p>
  </div>

  <div class="success-message" id="successMessage"></div>

  <div class="admin-controls">
    <button class="btn-primary" onclick="openAddProductModal()">➕ Add New Product</button>
    <button class="btn-primary" onclick="window.location.href='index.html'">🏠 View Website</button>
  </div>

  <div id="productsContainer" class="products-grid">
    <div class="loading">Loading products...</div>
  </div>

  <!-- Add Product Modal -->
  <div id="addProductModal" class="modal">
    <div class="modal-content">
      <h2 class="modal-header">Add New Product</h2>
      <form id="addProductForm">
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="newProductName" required placeholder="e.g., Cloth 71">
        </div>
        <div class="form-group">
          <label>Price (₦)</label>
          <input type="number" id="newProductPrice" required placeholder="e.g., 15000">
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" id="newProductStock" required placeholder="e.g., 5">
        </div>
        <div class="form-group">
          <label>Image Path</label>
          <input type="text" id="newProductImage" required placeholder="/images/71.jpg">
          <small style="color: #999; display: block; margin-top: 5px;">
            Upload image to /images folder first, then enter the path
          </small>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeAddProductModal()">Cancel</button>
          <button type="submit" class="btn-primary">Add Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>

  <script>
    // Load all products
    async function loadProducts() {
      try {
        const { data: products, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: true });

        if (error) throw error;

        displayProducts(products);
      } catch (err) {
        console.error('Error loading products:', err);
        document.getElementById('productsContainer').innerHTML = 
          '<div class="loading" style="color: #c41e3a;">Error loading products. Please refresh.</div>';
      }
    }

    // Display products
    function displayProducts(products) {
      const container = document.getElementById('productsContainer');
      container.innerHTML = '';

      products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="product-image-container">
            <img src="${product.image}" alt="${product.name}" class="product-image" onerror="this.src='https://via.placeholder.com/250x250/0f0f0f/d4af37?text=No+Image'">
            <button class="change-image-btn" onclick="changeImage(${product.id}, '${product.image}')">Change Image</button>
          </div>
          <div class="product-field">
            <label>Product Name</label>
            <input type="text" value="${product.name}" id="name-${product.id}" onchange="updateProduct(${product.id}, 'name', this.value)">
          </div>
          <div class="product-field">
            <label>Price (₦)</label>
            <input type="number" value="${product.price}" id="price-${product.id}" onchange="updateProduct(${product.id}, 'price', this.value)">
          </div>
          <div class="product-field">
            <label>Stock</label>
            <input type="number" value="${product.stock}" id="stock-${product.id}" onchange="updateProduct(${product.id}, 'stock', this.value)">
          </div>
          <div class="product-field">
            <label>Image Path</label>
            <input type="text" value="${product.image}" id="image-${product.id}" onchange="updateProduct(${product.id}, 'image', this.value)">
          </div>
          <div class="product-actions">
            <button class="btn-delete" onclick="deleteProduct(${product.id}, '${product.name}')">🗑️ Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Update product field
    async function updateProduct(id, field, value) {
      try {
        const updateData = {};
        updateData[field] = field === 'price' || field === 'stock' ? parseInt(value) : value;

        const { error } = await supabaseClient
          .from('products')
          .update(updateData)
          .eq('id', id);

        if (error) throw error;

        showSuccess(`✅ ${field.charAt(0).toUpperCase() + field.slice(1)} updated successfully!`);
      } catch (err) {
        console.error('Error updating product:', err);
        alert('Failed to update product. Please try again.');
      }
    }

    // Delete product
    async function deleteProduct(id, name) {
      if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

      try {
        const { error } = await supabaseClient
          .from('products')
          .delete()
          .eq('id', id);

        if (error) throw error;

        showSuccess(`✅ Product "${name}" deleted successfully!`);
        loadProducts();
      } catch (err) {
        console.error('Error deleting product:', err);
        alert('Failed to delete product. Please try again.');
      }
    }

    // Change image
    function changeImage(id, currentImage) {
      const newImage = prompt('Enter new image path (e.g., /images/71.jpg):', currentImage);
      if (newImage && newImage !== currentImage) {
        updateProduct(id, 'image', newImage);
        setTimeout(loadProducts, 500);
      }
    }

    // Add new product modal
    function openAddProductModal() {
      document.getElementById('addProductModal').style.display = 'block';
    }

    function closeAddProductModal() {
      document.getElementById('addProductModal').style.display = 'none';
      document.getElementById('addProductForm').reset();
    }

    // Add new product
    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const newProduct = {
        name: document.getElementById('newProductName').value,
        price: parseInt(document.getElementById('newProductPrice').value),
        stock: parseInt(document.getElementById('newProductStock').value),
        image: document.getElementById('newProductImage').value
      };

      try {
        const { error } = await supabaseClient
          .from('products')
          .insert([newProduct]);

        if (error) throw error;

        showSuccess('✅ New product added successfully!');
        closeAddProductModal();
        loadProducts();
      } catch (err) {
        console.error('Error adding product:', err);
        alert('Failed to add product. Please try again.');
      }
    });

    // Show success message
    function showSuccess(message) {
      const successMsg = document.getElementById('successMessage');
      successMsg.textContent = message;
      successMsg.style.display = 'block';
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 3000);
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
      const modal = document.getElementById('addProductModal');
      if (event.target === modal) {
        closeAddProductModal();
      }
    }

    // Load products on page load
    loadProducts();
  </script>
</body>
</html>
